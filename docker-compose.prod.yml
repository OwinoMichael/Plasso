services:
  db:
    image: ankane/pgvector:latest
    container_name: pg-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: always
    # Don't expose ports externally in production - only internal access
    expose:
      - "5432"

  spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: springboot-app-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      # Add any other environment variables your app needs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"
    networks:
      - app-network
    restart: always
    # Don't expose Spring Boot port externally - nginx will proxy to it
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: react-app-prod
    depends_on:
      - spring
    ports:
      - "3003:80"
    networks:
      - app-network
    restart: always
    

volumes:
  pgdata_prod:
    driver: local
  nginx_logs:
    driver: local

networks:
  app-network:
    driver: bridge