spring.application.name=Plasso : CodeSync
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.url=jdbc:postgresql://localhost:5432/plasso
#spring.datasource.username=postgres
#spring.datasource.password=Mike2000

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

logging.level.org.hibernate=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG

app.base-url=${BACKEND_URL:http://localhost:8080}
app.frontend.base-url=${FRONTEND_URL:http://localhost:5173}
app.ws-url=${WS_URL:ws://localhost:8080/ws}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.validation.mode=none
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION:604800000}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Judge 0
judge0.api.url=https://judge0-ce.p.rapidapi.com
judge0.api.key=${JUDGE0_API_KEY}
judge0.api.host=judge0-ce.p.rapidapi.com


# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent








